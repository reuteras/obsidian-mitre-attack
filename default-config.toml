repository_url = "https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master"
output_dir = "output"
version = "19.2"
verbose = true
# Embed Analytics within Detection Strategies using tab-panels plugin syntax
# When true, Analytics are included as tabs in Detection Strategy files
# Requires: https://github.com/GnoxNahte/obsidian-tab-panels
embed_analytics_in_detection_strategies = false

# Also download MITRE ATLAS (Adversarial Threat Landscape for AI Systems) data
# and generate Obsidian notes for it, under output/ATLAS/.
# See: https://github.com/mitre-atlas/atlas-data
atlas_enabled = true
atlas_repository_url = "https://raw.githubusercontent.com/mitre-atlas/atlas-data/main"
# Pinned to a specific release string (e.g. "2026.09") for reproducible output.
# "latest" resolves to the newest monthly release via dist/manifest.yaml instead.
atlas_version = "2026.09"
